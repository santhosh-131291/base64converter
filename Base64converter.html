<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Base64 Encoder</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #111827;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .output-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            min-height: 80px;
            word-wrap: break-word;
            font-family: 'Courier New', Courier, monospace;
            color: #0f172a;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Text to Base64 Encoder</h2>
    
    <label for="inputText">Input Text</label>
    <textarea id="inputText" placeholder="Type or paste anything here..."></textarea>

    <label>Base64 Output</label>
    <div id="outputText" class="output-box"></div>
</div>

<script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');

    // Function to safely encode text to Base64 (supports Unicode/Emojis)
    function encodeToBase64(str) {
        if (!str) return '';
        try {
            // encodeURIComponent handles UTF-8 (emojis, special chars)
            // unescape converts it back to a byte string for btoa()
            return btoa(unescape(encodeURIComponent(str)));
        } catch (e) {
            return "Error encoding input.";
        }
    }

    // Listen for keystrokes and update instantly
    inputText.addEventListener('input', function() {
        const encoded = encodeToBase64(inputText.value);
        outputText.textContent = encoded;
    });
</script>

</body>
</html>
